syntax = "proto3";

package game.proto.v1;

option csharp_namespace = "RetroGate.Protos.Game.Proto.V1";

enum GameInstallationMethod {
    GAME_INSTALLATION_METHOD_EXTRACT = 0;
}

message GameModel {
    string id = 1;
    string name = 2;
    string download_url = 3;
    string executable_path = 4;
    string image_hero_url = 5;
    string image_poster_url = 6;
    string image_logo_url = 7;
    GameInstallationMethod installation_method = 8;
    optional string settings_file = 9;
}