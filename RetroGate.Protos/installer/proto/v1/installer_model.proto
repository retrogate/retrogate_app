syntax = "proto3";

package installer.proto.v1;

option csharp_namespace = "RetroGate.Protos.Installer.Proto.V1";

enum ProgressStatus {
    PROGRESS_STATUS_IDLE = 0;
    PROGRESS_STATUS_DOWNLOADING = 1;
    PROGRESS_STATUS_EXTRACTING = 2;
    PROGRESS_STATUS_ADDING_TO_LIBRARY = 3;
    PROGRESS_STATUS_PAUSED = 4;
    PROGRESS_STATUS_COMPLETED = 5;
    PROGRESS_STATUS_FAILED = 6;
}

message ProgressModel {
    string id = 1;
    ProgressStatus status = 2;
    int32 percentage = 3;
    int32 speed_in_kb_per_sec = 4;
}
